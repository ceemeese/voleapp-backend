services:
  db:
    image: mysql:8.3
    container_name: voleapp_production_db
    env_file:
      - ./src/Web.Api/.env.production
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data_production:/var/lib/mysql
  
  api:
    build:
      context: .
      dockerfile: ./src/Web.Api/Dockerfile
    container_name: voleapp_production_api
    depends_on:
      - db
    env_file:
      - ./src/Web.Api/.env.production
    ports:
      - "8080:8080"

volumes:
  db_data_production:
